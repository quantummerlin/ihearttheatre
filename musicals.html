<style>
/* iHT theme overrides for Role Finder */
:root {
    --bg-primary:    #050508;

body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', system-ui, sans-serif; }

/* Page hero */

}

    font-weight: 700;

}

/* Controls */

<script defer src="js/shared.js?v=202604150813"></script>
<script>
(function() {
    var allMusicals = [];
    var AUDITION_SONGS = {};
    var OPEN_AUDITION_TITLES = new Set();

    function normalizeTitle(s) {
        return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function musicalHasAuditions(musicalId) {
        var meta = allMusicals.find(function(m) { return m.id === musicalId; });
        if (!meta) return false;
        return OPEN_AUDITION_TITLES.has(normalizeTitle(meta.title));
    }

    function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function diffClass(d) {
        if (!d) return '';
        d = d.toLowerCase();
        if (d.includes('expert')) return 'diff-expert';
        if (d.includes('advanced')) return 'diff-advanced';
        if (d.includes('intermediate')) return 'diff-intermediate';
        if (d.includes('beginner')) return 'diff-beginner';
        return '';
    }

    function diffLabel(d) {
        if (!d) return '';
        d = d.toLowerCase();
        if (d.includes('expert')) return 'Expert';
        if (d.includes('advanced_to_expert')) return 'Adv�Expert';
        if (d.includes('advanced')) return 'Advanced';
        if (d.includes('intermediate_to_advanced')) return 'Int�Adv';
        if (d.includes('intermediate')) return 'Intermediate';
        if (d.includes('beginner')) return 'Beginner';
        return d;
    }

    function danceLabel(d) {
        if (!d) return '';
        const map = {
            none: 'No Dance', minimal: 'Minimal Dance', light: 'Light Dance',
            low: 'Low Dance', low_to_moderate: 'Some Dance', moderate: 'Some Dance',
            medium: 'Some Dance', moderate_to_high: 'High Dance',
            high: 'Dance Heavy', very_high: 'Very Dance Heavy',
            choreography_heavy: 'Choreo Heavy', intermediate_to_advanced: 'High Dance'
        };
        return map[String(d).toLowerCase().replace(/[ \-]/g,'_')] || d;
    }

    function renderMusicalCard(m, idx) {
        const genres = (m.genre_tags || []).slice(0, 3).map(g =>
            `<span class="genre-tag">${escHtml(g.replace(/_/g,' '))}</span>`
        ).join('');
        const dc = diffClass(m.difficulty_overall);
        const dl = diffLabel(m.difficulty_overall);

        // Parse age range � take text before first '(' and truncate
        var ageChip = '';
        if (m.age_range) {
            var ageText = String(m.age_range).split('(')[0].trim().replace(/\s+/g, ' ');
            if (ageText.length > 22) ageText = ageText.slice(0, 22).replace(/\s+\S*$/, '') + '\u2026';
            if (ageText) ageChip = `<span class="meta-chip meta-age">Ages: ${escHtml(ageText)}</span>`;
        }

        return `<div class="musical-card card-glow" data-reveal style="animation-delay:${idx * 0.04}s" data-id="${escHtml(m.id)}" onclick="openModal('${escHtml(m.id)}')">
            <div class="card-cover" style="background-image: url('images/musicals/${escHtml(m.id)}.jpg')"></div>
            <div class="musical-title">${escHtml(m.title)}</div>
            <div class="musical-composer">${escHtml(m.music_by)}${m.year_premiered?' &bull; '+m.year_premiered:''}</div>
            <div class="musical-meta">
                ${dl ? `<span class="meta-chip ${dc}">${escHtml(dl)}</span>` : ''}
                ${m.dance_intensity ? `<span class="meta-chip meta-dance">${escHtml(danceLabel(m.dance_intensity))}</span>` : ''}
                ${ageChip}
            </div>
            ${genres ? `<div class="genre-tags">${genres}</div>` : ''}
            <div class="card-footer-row">
                <span class="role-count">${m.role_count || '?'} roles</span>
                <button class="view-roles-btn">View Roles &rarr;</button>
            </div>
        </div>`;
    }

    function normDance(d) {
        if (!d) return '';
        d = d.toLowerCase().replace(/[\s\-]/g, '_');
        if (d === 'very_high') return 'very_high';
        if (d === 'high' || d === 'choreography_heavy') return 'high';
        if (d === 'moderate_to_high' || d === 'intermediate_to_advanced') return 'high';
        if (d === 'moderate' || d === 'medium' || d === 'light_to_moderate' || d === 'low_to_moderate') return 'moderate';
        return 'low'; // low, light, minimal, none
    }

    function normDiff(d) {
        if (!d) return '';
        d = d.toLowerCase();
        if (d.includes('expert')) return 'expert';
        if (d.includes('advanced')) return 'advanced';
        if (d.includes('intermediate')) return 'intermediate';
        if (d.includes('beginner')) return 'beginner';
        return '';
    }

    function getFiltered() {
        var q = document.getElementById('search-input').value.toLowerCase().trim();
        var danceVal = document.getElementById('filter-dance').value;
        var diffVal = document.getElementById('filter-difficulty').value;
        var juniorOn = document.getElementById('filter-junior').classList.contains('active');
        var auditionsOn = document.getElementById('filter-auditions').classList.contains('active');

        return allMusicals.filter(function(m) {
            // Text search
            if (q) {
                var s = [m.title, m.music_by, (m.genre_tags||[]).join(' '), m.vocal_style, m.difficulty_overall, m.dance_intensity].join(' ').toLowerCase();
                if (!s.includes(q)) return false;
            }
            // Dance level filter
            if (danceVal && normDance(m.dance_intensity) !== danceVal) return false;
            // Difficulty filter
            if (diffVal) {
                var nd = normDiff(m.difficulty_overall);
                if (diffVal === 'expert') { if (nd !== 'expert') return false; }
                else if (diffVal === 'advanced') { if (nd !== 'advanced' && nd !== 'expert') return false; }
                else if (diffVal === 'intermediate') { if (nd !== 'intermediate') return false; }
                else if (diffVal === 'beginner') { if (nd !== 'beginner') return false; }
            }
            // Junior shows toggle
            if (juniorOn && !m.junior_version_available) return false;
            // Open auditions toggle
            if (auditionsOn && !OPEN_AUDITION_TITLES.has(normalizeTitle(m.title))) return false;
            return true;
        });
    }

    function updateResultsCount() {
        var filtered = getFiltered();
        var el = document.getElementById('results-count');
        if (filtered.length === allMusicals.length) {
            el.textContent = allMusicals.length + ' musicals';
        } else {
            el.textContent = filtered.length + ' of ' + allMusicals.length;
        }
    }

    function render() {
        var grid = document.getElementById('musicals-grid');
        var filtered = getFiltered();
        updateResultsCount();
        if (!filtered.length) {
            grid.innerHTML = '<div class="no-results"><p>No musicals match your current filters. Try broadening your search.</p></div>';
            return;
        }
        grid.innerHTML = filtered.map(function(m, i) { return renderMusicalCard(m, i); }).join('');
        // Observe newly rendered cards for scroll reveal
        if (window.iHTReveal) {
            grid.querySelectorAll('[data-reveal]').forEach(function(el) { window.iHTReveal.observe(el); });
        }
    }

    // -- Modal / role guide ----------------------------------------------
    var loadedRoles = {};

    window.openModal = function(musicalId) {
        var overlay = document.getElementById('modal-overlay');
        var titleEl = document.getElementById('modal-title');
        var composerEl = document.getElementById('modal-composer');
        var bodyEl = document.getElementById('modal-body');

        var meta = allMusicals.find(m => m.id === musicalId);
        if (meta) {
            titleEl.textContent = meta.title;
            composerEl.textContent = meta.music_by + (meta.year_premiered ? ' � ' + meta.year_premiered : '');
        }

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';

        if (loadedRoles[musicalId]) {
            renderRoles(bodyEl, loadedRoles[musicalId]);
            return;
        }

        bodyEl.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Loading roles�</span></div>';

        fetch('data/musicals/' + musicalId + '.json')
            .then(r => r.json())
            .then(data => {
                loadedRoles[musicalId] = data;
                renderRoles(bodyEl, data);
            })
            .catch(() => {
                bodyEl.innerHTML = '<p style="color:var(--text-secondary);padding:20px;">Couldn\'t load roles right now � try refreshing the page!</p>';
            });
    };

    function renderRoles(container, data) {
        var musical = data.musical || {};
        var roles = data.roles || [];

        var html = '';

        // Musical overview strip
        if (musical.vocal_style || musical.synopsis || musical.junior_version_available) {
            html += '<div style="background:rgba(232,185,35,0.07);border:1px solid rgba(232,185,35,0.2);border-radius:12px;padding:14px 16px;margin-bottom:20px;">';
            if (musical.junior_version_available) {
                html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.8rem;color:#a78bfa;font-weight:600;">&#10024; A Junior/Kids edition of this musical exists � role names, song keys and casting ages may differ. These guides cover the standard version.</div>';
            }
            if (musical.vocal_style) html += '<div style="font-size:0.83rem;color:var(--text-secondary);margin-bottom:6px;font-style:italic;">' + escHtml(musical.vocal_style) + '</div>';
            if (musical.synopsis) {
                var synopsisId = 'synopsis-' + (musical.id || 'x');
                html += '<div id="' + synopsisId + '" style="font-size:0.82rem;color:var(--text-secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">' + escHtml(musical.synopsis) + '</div>';
                html += '<button class="expand-desc" style="margin-top:6px;" onclick="toggleExpand(\'' + synopsisId + '\',this)">Read more ?</button>';
            }
            html += '</div>';
        }

        html += '<div class="modal-roles-label">' + roles.length + ' roles to explore � click any role to see everything</div>';

        roles.forEach(function(role) {
            html += renderRoleCard(role, musical.id);
        });

        container.innerHTML = html;
    }

    function renderRoleCard(role, musicalId) {
        var typeClass = { lead: 'type-lead', supporting: 'type-supporting', featured_ensemble: 'type-character', character: 'type-character', ensemble: 'type-ensemble' };
        var typeLabel = { lead: 'Lead', supporting: 'Supporting', featured_ensemble: 'Featured', character: 'Character', ensemble: 'Ensemble' };

        var rt = (role.role_type || 'supporting').toLowerCase();
        var tc = typeClass[rt] || 'type-supporting';
        var tl = typeLabel[rt] || rt;

        var ageStr = '';
        if (role.age_range) {
            if (typeof role.age_range === 'object') ageStr = (role.age_range.min || '?') + '�' + (role.age_range.max || '?');
            else ageStr = role.age_range;
        }

        var descId = 'desc-' + escHtml(role.id).replace(/[^a-z0-9]/gi, '-');

        var hasAuditions = musicalHasAuditions(musicalId);

        var html = '<div class="role-card">';
        html += '<div class="role-header" onclick="this.closest(\'.role-card\').classList.toggle(\'open\')"><div class="role-name">' + escHtml(role.name) + '</div><div class="role-header-right">' + (ageStr ? '<span class="role-age-chip">Age ' + escHtml(ageStr) + '</span>' : '') + (hasAuditions ? '<span class="role-audit-badge">&#127908; Auditions Open</span>' : '') + '<span class="role-type-badge ' + tc + '">' + tl + '</span></div><span class="role-chevron">&#9660;</span></div>';
        html += '<div class="role-body">';

        // Vocal chips
        if (role.vocal) {
            html += '<div class="vocal-row">';
            if (role.vocal.voice_type) html += '<span class="vocal-chip">' + escHtml(role.vocal.voice_type.replace(/_/g,' ')) + '</span>';
            if (role.vocal.range) html += '<span class="vocal-chip">' + escHtml(role.vocal.range) + '</span>';
            if (role.vocal.belt_required) html += '<span class="vocal-chip belt">Belt required ' + (role.vocal.belt_range ? '(' + escHtml(role.vocal.belt_range) + ')' : '') + '</span>';
            if (ageStr) html += '<span class="vocal-chip" style="background:rgba(255,255,255,0.05);color:var(--text-secondary);border-color:var(--glass-border);">Age ' + escHtml(ageStr) + '</span>';
            html += '</div>';
        }

        // Description
        if (role.description) {
            html += '<div class="role-description" style="display:block;overflow:visible;-webkit-line-clamp:none;">' + escHtml(role.description) + '</div>';
        }

        // Songs from the show
        var keySongs = role.key_songs || [];
        html += '<div class="songs-section">';
        html += '<div class="songs-label show-songs">Songs from this show</div>';
        if (keySongs.length) {
            keySongs.forEach(function(s) {
                html += '<div class="song-item show-song">';
                html += '<span class="song-item-icon">?</span>';
                html += '<div><div style="font-weight:600;color:var(--text-primary);">' + escHtml(s.title) + '</div>';
                if (s.type) html += '<div style="font-size:0.75rem;color:var(--accent-primary);text-transform:capitalize;margin-bottom:2px;">' + escHtml(s.type.replace(/_/g,' ')) + '</div>';
                if (s.notes) html += '<div class="song-note">' + escHtml(s.notes) + '</div>';
                html += '</div></div>';
            });
        } else {
            html += '<div class="no-songs">Song details coming soon � check back!</div>';
        }
        html += '</div>';

        // Audition song suggestions - use curated database if available, else fall back to tips
        var curatedKey = (musicalId || '') + '/' + (role.id || '');
        var curated = AUDITION_SONGS[curatedKey];

        html += '<div class="songs-section">';
        html += '<div class="songs-label audition-songs">Songs to bring to your audition</div>';
        if (curated && curated.songs_to_prepare && curated.songs_to_prepare.length) {
            curated.songs_to_prepare.forEach(function(s) {
                var typeIcon = '\u266a';
                html += '<div class="song-item audition-tip">';
                html += '<span class="song-item-icon">' + typeIcon + '</span>';
                html += '<div><div style="font-weight:600;color:var(--text-primary);">' + escHtml(s.title) + '</div>';
                html += '<div style="font-size:0.75rem;color:var(--accent-primary);margin-bottom:2px;">' + escHtml(s.from) + ' � ' + escHtml(s.composer) + '</div>';
                html += '<div class="song-note">' + escHtml(s.why) + '</div>';
                html += '</div></div>';
            });
            if (curated.style_guidance) {
                html += '<div style="margin-top:8px;padding:8px 10px;background:rgba(232,185,35,0.06);border-left:2px solid var(--accent-primary);border-radius:0 6px 6px 0;font-size:0.8rem;color:var(--text-secondary);line-height:1.5;">' + escHtml(curated.style_guidance) + '</div>';
            }
            if (curated.avoid && curated.avoid.length) {
                html += '<div style="margin-top:6px;font-size:0.75rem;color:#ff8080;">Avoid: ' + curated.avoid.map(function(a){ return escHtml(a); }).join(' � ') + '</div>';
            }
        } else {
            var tips = (role.audition_guidance || {}).tips || [];
            var songTips = tips.filter(function(t) {
                return /prepare|song|sing|32 bar|bars|repertoire|material/i.test(t);
            });
            var isEnsemble = rt === 'ensemble' || rt === 'featured_ensemble';
            if (songTips.length) {
                songTips.forEach(function(tip) {
                    html += '<div class="song-item audition-tip"><span class="song-item-icon">?</span><div>' + escHtml(tip) + '</div></div>';
                });
            } else if (isEnsemble) {
                html += '<div class="song-item audition-tip"><span class="song-item-icon">?</span><div><div style="font-weight:600;color:var(--text-primary);">Pick a song that shows your character commitment</div><div class="song-note">For ensemble, directors want to see you fully inhabit a character � not just sing. Choose something that lets your personality shine and matches the energy of this show.</div></div></div>';
                html += '<div class="song-item audition-tip"><span class="song-item-icon">?</span><div><div style="font-weight:600;color:var(--text-primary);">Favour uptempo + ballad contrast</div><div class="song-note">If you get two slots, bring one uptempo and one ballad. Show range in both voice and emotional storytelling. Stay in the style of the show.</div></div></div>';
                html += '<div class="song-item audition-tip"><span class="song-item-icon">?</span><div><div style="font-weight:600;color:var(--text-primary);">32 bars is plenty</div><div class="song-note">Keep it tight and memorable. A killer 32-bar cut beats a full song that loses focus. Know your start note and nail that first phrase.</div></div></div>';
            } else {
                html += '<div class="song-item audition-tip"><span class="song-item-icon">?</span><div><div style="font-weight:600;color:var(--text-primary);">Choose something that feels like YOU</div><div class="song-note">Pick a song that sits beautifully in your voice and connects you emotionally to this type of character. There\'s no single right answer � authenticity always wins the room.</div></div></div>';
            }
        }
        html += '</div>';

        // What directors look for
        var lookFor = (role.audition_guidance || {}).what_directors_look_for || [];
        if (lookFor.length) {
            html += '<div class="director-section">';
            html += '<div class="director-label">What directors love to see</div>';
            html += '<ul class="director-list">' + lookFor.slice(0, 4).map(function(f) {
                return '<li>' + escHtml(f) + '</li>';
            }).join('') + '</ul>';
            html += '</div>';
        }

        // Career Builder CTA
        html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;flex-wrap:wrap;">';
        html += '<a href="career-builder.html?musical=' + encodeURIComponent((musicalId||'')) + '&role=' + encodeURIComponent((role.id||'')) + '" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(232,185,35,0.15),rgba(185,28,28,0.15));border:1px solid rgba(232,185,35,0.3);border-radius:8px;padding:7px 14px;font-size:0.8rem;font-weight:600;color:#e8b923;text-decoration:none;transition:border-color 0.2s;" onmouseover="this.style.borderColor=\'#e8b923\'" onmouseout="this.style.borderColor=\'rgba(232,185,35,0.3)\'">Could this be my role? ?</a>';
        html += '</div>';

        html += '</div>'; // end role-body
        html += '</div>'; // end role-card
        return html;
    }

    window.toggleExpand = function(id, btn) {
        var el = document.getElementById(id);
        if (!el) return;
        var isExpanded = el.dataset.expanded === '1';
        if (isExpanded) {
            el.style.display = '-webkit-box';
            el.style.webkitLineClamp = '3';
            el.style.webkitBoxOrient = 'vertical';
            el.style.overflow = 'hidden';
            el.dataset.expanded = '0';
            btn.textContent = 'Read more \u2193';
        } else {
            el.style.display = 'block';
            el.style.webkitLineClamp = 'none';
            el.style.overflow = 'visible';
            el.dataset.expanded = '1';
            btn.textContent = 'Show less \u2191';
        }
    };

    // Close modal
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    // Filter dropdowns
    document.getElementById('filter-dance').addEventListener('change', function() {
        this.classList.toggle('has-value', !!this.value);
        render();
    });
    document.getElementById('filter-difficulty').addEventListener('change', function() {
        this.classList.toggle('has-value', !!this.value);
        render();
    });

    // Toggle pill filters
    document.getElementById('filter-junior').addEventListener('click', function() {
        this.classList.toggle('active');
        render();
    });
    document.getElementById('filter-auditions').addEventListener('click', function() {
        this.classList.toggle('active');
        render();
    });

    // Search
    document.getElementById('search-input').addEventListener('input', function() { render(); });

    // Load audition songs database
    fetch('data/audition-songs.json')
        .then(r => r.json())
        .then(data => { AUDITION_SONGS = data.songs || {}; })
        .catch(() => {});

    // Load open auditions so role headers can show the badge
    fetch('data/noticeboard/submissions.json')
        .then(r => r.json())
        .then(function(data) {
            var now = new Date();
            (data.submissions || []).forEach(function(s) {
                if (!s.show_title) return;
                var closeDate = s.closing_date ? new Date(s.closing_date) : null;
                var audDate = s.audition_date ? new Date(s.audition_date) : null;
                var isClosed = (closeDate && now > closeDate) || (!closeDate && audDate && audDate < now);
                if (!isClosed) OPEN_AUDITION_TITLES.add(normalizeTitle(s.show_title));
            });
        })
        .catch(function() {});

    // Load index
    fetch('data/musicals-index.json')
        .then(r => r.json())
        .then(data => {
            allMusicals = Array.isArray(data) ? data : [];
            allMusicals.sort(function(a, b) { return (a.title || '').localeCompare(b.title || ''); });
            // Update hero badge with actual count
            var badge = document.getElementById('hero-badge');
            if (badge) badge.textContent = allMusicals.length + ' Musicals · Role Finder';
            render();
            // Handle URL deep-links from career-builder.html
            var params = new URLSearchParams(window.location.search);
            var musicalParam = params.get('musical');
            var roleParam = params.get('role');
            if (musicalParam) {
                var m = allMusicals.find(function(x){ return x.id === musicalParam; });
                if (m) { window.openModal(musicalParam, m.title || musicalParam, m.music_by || ''); }
            }
        })
        .catch(() => {
            document.getElementById('musicals-grid').innerHTML =
                '<div class="no-results"><p>Unable to load musicals data.</p></div>';
        });
})();
</script>
</body>
<script src="/js/main.js"></script>
</body>
</html>
