<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — iHeartTheatre</title>
<meta name="theme-color" content="#e8b923">
<link rel="icon" type="image/svg+xml" href="/images/icons/iht-icon.svg">
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --bg-primary:#050508;--text-primary:#f5f5f5;--text-secondary:#c0c0d0;
    --accent-primary:#e8b923;--accent-secondary:#b91c1c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg-primary);color:var(--text-primary);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .wrap{max-width:520px}
  .code{
    font-size:4.5rem;font-weight:800;line-height:1;margin-bottom:16px;
    background:linear-gradient(135deg,#e8b923,#b91c1c);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.8rem;margin-bottom:12px}
  p{color:var(--text-secondary);line-height:1.6;margin-bottom:24px}
  .btn{
    display:inline-block;padding:12px 28px;border-radius:24px;font-weight:700;
    text-decoration:none;background:linear-gradient(135deg,#e8b923,#b91c1c);color:#fff;
    border:none;font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .emoji{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<main class="wrap">
  <div class="emoji">🎭</div>
  <div class="code">Offline</div>
  <h1>The House Lights Are Down</h1>
  <p>You're currently offline and this page isn't saved for offline viewing yet. Check your connection and try again — the show must go on!</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</main>
</body>
</html>
