<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>What's On — iHeartTheatre</title>
  <meta name="description" content="Melbourne theatre calendar — professional, community and school shows happening now, opening soon and coming up.">
  <meta property="og:title" content="What's On — iHeartTheatre">
  <meta property="og:description" content="Melbourne theatre shows, dates, venues and booking info — professional, community and school productions.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#8B0000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/svg+xml" href="/images/icons/iht-icon.svg">
  <link rel="manifest" href="/manifest.json">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RS9LV72HK8"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RS9LV72HK8');</script>
</head>
<body>
<main>

  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="page-hero-eyebrow">🎭 Melbourne Theatre Calendar</div>
    <h1 class="page-hero-title">What's <em>On</em></h1>
    <p class="page-hero-sub">Upcoming shows across Melbourne — professional, community and school productions. All levels, all stages.</p>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar" role="toolbar" aria-label="Filter shows">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="now">Now Showing</button>
    <button class="filter-btn" data-filter="soon">Opening Soon</button>
    <button class="filter-btn" data-filter="musical">Musical</button>
    <button class="filter-btn" data-filter="drama">Drama</button>
    <button class="filter-btn" data-filter="comedy">Comedy</button>
    <button class="filter-btn" data-filter="kids">Kids</button>
    <div style="margin-left:auto;flex-shrink:0">
      <div class="search-bar">
        <span class="search-bar-icon">🔍</span>
        <input type="text" id="showSearch" placeholder="Search shows…" aria-label="Search shows">
      </div>
    </div>
  </div>

  <!-- SHOWS GRID — populated from calendar.json + JS filter -->
  <section class="hub-section reveal-section" aria-label="Shows listing" style="padding-bottom:40px">
    <div class="show-card-grid reveal-stagger" id="showsGrid">
      <!-- Populated by JS from /data/calendar.json -->
    </div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-state-icon">🎭</div>
      <div class="empty-state-text">No shows match your filter. Try another category.</div>
    </div>
  </section>

</main>

<script>
/* ── What's On — Melbourne calendar.json data + filter logic ── */
(function() {

  var rawShows = [];
  var grid = document.getElementById('showsGrid');
  var emptyState = document.getElementById('emptyState');
  var currentFilter = 'all';
  var currentSearch = '';

  /* ── Date helpers ──────────────────────────────────────── */
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseDate(str) {
    // Accepts "YYYY-MM-DD"
    var parts = str.split('-');
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function formatDate(d) {
    var dd = d.getDate();
    if (dd < 10) dd = '0' + dd;
    return dd + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatDateRange(startStr, endStr) {
    var s = parseDate(startStr);
    var e = parseDate(endStr);
    if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth() && s.getDate() === e.getDate()) {
      return formatDate(s);
    }
    // If same year, don't repeat year on start
    if (s.getFullYear() === e.getFullYear()) {
      var dd = s.getDate();
      if (dd < 10) dd = '0' + dd;
      return dd + ' ' + MONTHS[s.getMonth()] + ' – ' + formatDate(e);
    }
    return formatDate(s) + ' – ' + formatDate(e);
  }

  function todayMidnight() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  /* ── Emoji fallback map ────────────────────────────────── */
  var EMOJI_MAP = {
    'musical':  '🎭',
    'drama':    '🎬',
    'comedy':   '😂',
    'kids':     '👨‍👩‍👧‍👦',
    'opera':    '🎶',
    'panto':    '🎪',
    'family':   '🏠',
    'youth':    '⭐'
  };

  var FILTER_TAGS = ['musical', 'drama', 'comedy', 'kids', 'opera', 'panto', 'family', 'youth'];

  /* ── Derive filter tags from genre + tags arrays ──────── */
  function deriveFilterTags(show) {
    var tags = [];
    var allLabels = [];
    if (show.genre && show.genre.length) allLabels = allLabels.concat(show.genre);
    if (show.tags && show.tags.length) allLabels = allLabels.concat(show.tags);
    for (var i = 0; i < FILTER_TAGS.length; i++) {
      var ft = FILTER_TAGS[i];
      for (var j = 0; j < allLabels.length; j++) {
        if (allLabels[j].toLowerCase().indexOf(ft) !== -1) {
          if (tags.indexOf(ft) === -1) tags.push(ft);
          break;
        }
      }
    }
    return tags;
  }

  /* ── Pick primary emoji from genre/tags ────────────────── */
  function pickEmoji(show) {
    var allLabels = [];
    if (show.genre && show.genre.length) allLabels = allLabels.concat(show.genre);
    if (show.tags && show.tags.length) allLabels = allLabels.concat(show.tags);
    for (var i = 0; i < allLabels.length; i++) {
      var key = allLabels[i].toLowerCase();
      if (EMOJI_MAP[key]) return EMOJI_MAP[key];
    }
    // Try partial match
    for (var ek in EMOJI_MAP) {
      for (var j = 0; j < allLabels.length; j++) {
        if (allLabels[j].toLowerCase().indexOf(ek) !== -1) return EMOJI_MAP[ek];
      }
    }
    return '🎭';
  }

  /* ── Status badge from production_type ────────────────── */
  function buildStatusBadge(productionType) {
    var pt = (productionType || '').toLowerCase();
    if (pt === 'professional') return '<span class="badge badge-musical">Professional</span>';
    if (pt === 'community')   return '<span class="badge badge-company">Community</span>';
    if (pt === 'school')      return '<span class="badge badge-audition">School</span>';
    return '<span class="badge badge-company">' + (productionType || 'Production') + '</span>';
  }

  /* ── Genre badges ──────────────────────────────────────── */
  function buildGenreBadges(show) {
    var badges = [];
    var genres = show.genre || [];
    for (var i = 0; i < genres.length; i++) {
      var g = genres[i];
      var emoji = EMOJI_MAP[g.toLowerCase()] || '🎭';
      var cls = 'badge-company';
      var gl = g.toLowerCase();
      if (gl.indexOf('musical') !== -1) cls = 'badge-musical';
      else if (gl.indexOf('drama') !== -1) cls = 'badge-drama';
      else if (gl.indexOf('comedy') !== -1) cls = 'badge-comedy';
      else if (gl.indexOf('kids') !== -1 || gl.indexOf('children') !== -1) cls = 'badge-kids';
      badges.push('<span class="badge ' + cls + '">' + emoji + ' ' + g + '</span>');
    }
    return badges.join('');
  }

  /* ── Render a single show card ────────────────────────── */
  function renderCard(show) {
    var emoji = show._emoji;
    var dates = show._dates;
    var statusBadge = buildStatusBadge(show.production_type);
    var genreBadges = buildGenreBadges(show);
    var ticketUrl = show.ticket_url || '#';
    var suburb = show.location || '';
    var venue = show.venue || '';
    var company = show.company || '';
    var title = show.show_title || 'Untitled';

    return (
      '<a href="' + ticketUrl + '" class="show-card">' +
        '<div class="show-card-poster">' +
          '<div class="show-card-poster-placeholder">' + emoji + '</div>' +
        '</div>' +
        '<div class="show-card-body">' +
          '<div class="article-card-meta" style="margin-bottom:4px">' +
            statusBadge +
          '</div>' +
          '<h3 class="show-card-title">' + title + '</h3>' +
          '<div class="show-card-venue">' + venue + (suburb ? ', ' + suburb : '') + '</div>' +
          '<div class="show-card-dates">' + dates + '</div>' +
          '<div class="show-card-company">' +
            genreBadges +
            (company ? '<span class="badge badge-company" style="margin-left:4px">' + company + '</span>' : '') +
          '</div>' +
          '<div class="show-card-actions" style="margin-top:10px">' +
            '<span class="btn btn-sm btn-outline-gold">Get Tickets</span>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  /* ── Render all visible shows ─────────────────────────── */
  function renderShows(shows) {
    if (!shows.length) {
      grid.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';
    grid.innerHTML = shows.map(renderCard).join('');
  }

  /* ── Filter logic ─────────────────────────────────────── */
  function applyFilters() {
    var today = todayMidnight();
    var filtered = rawShows.filter(function(s) {
      var matchFilter = true;
      if (currentFilter === 'now') {
        matchFilter = s._dateStart <= today && s._dateEnd >= today;
      } else if (currentFilter === 'soon') {
        matchFilter = s._dateStart > today;
      } else if (FILTER_TAGS.indexOf(currentFilter) !== -1) {
        matchFilter = s._filterTags.indexOf(currentFilter) !== -1;
      } else if (currentFilter !== 'all') {
        matchFilter = true;
      }
      var q = currentSearch.toLowerCase();
      var matchSearch = !q
        || (s.show_title || '').toLowerCase().indexOf(q) !== -1
        || (s.company || '').toLowerCase().indexOf(q) !== -1
        || (s.venue || '').toLowerCase().indexOf(q) !== -1
        || (s.location || '').toLowerCase().indexOf(q) !== -1;
      return matchFilter && matchSearch;
    });
    renderShows(filtered);
  }

  /* ── Filter buttons ───────────────────────────────────── */
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  /* ── Search ───────────────────────────────────────────── */
  var searchInput = document.getElementById('showSearch');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      currentSearch = this.value;
      applyFilters();
    });
  }

  /* ── Show count badge ─────────────────────────────────── */
  function updateShowCount(count) {
    var existing = document.getElementById('showCountBadge');
    if (!existing) {
      var bar = document.getElementById('filterBar');
      if (bar) {
        existing = document.createElement('span');
        existing.id = 'showCountBadge';
        existing.style.cssText = 'margin-left:8px;font-size:0.75rem;color:#999;font-family:Inter,sans-serif;';
        bar.appendChild(existing);
      }
    }
    if (existing) {
      existing.textContent = count + ' show' + (count !== 1 ? 's' : '');
    }
  }

  /* ── Load calendar.json ───────────────────────────────── */
  function loadShows() {
    grid.innerHTML = '<div class="empty-state" style="display:block;width:100%;text-align:center;padding:40px"><div class="empty-state-icon">🎭</div><div class="empty-state-text">Loading shows…</div></div>';

    fetch('/data/calendar.json')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (!Array.isArray(data)) throw new Error('Expected array');

        var today = todayMidnight();

        // Process, enrich, filter expired, sort
        rawShows = data
          .filter(function(s) {
            // Remove expired shows: date_end < today
            if (!s.date_end) return false;
            var end = parseDate(s.date_end);
            return end >= today;
          })
          .map(function(s) {
            var ds = parseDate(s.date_start);
            var de = parseDate(s.date_end);
            return {
              id: s.id,
              show_title: s.show_title,
              company: s.company,
              venue: s.venue,
              location: s.location,
              region: s.region,
              date_start: s.date_start,
              date_end: s.date_end,
              dates_approximate: s.dates_approximate,
              production_type: s.production_type,
              genre: s.genre || [],
              tags: s.tags || [],
              musical_id: s.musical_id,
              ticket_url: s.ticket_url || '#',
              _dateStart: ds,
              _dateEnd: de,
              _dates: formatDateRange(s.date_start, s.date_end),
              _emoji: pickEmoji(s),
              _filterTags: deriveFilterTags(s)
            };
          })
          .sort(function(a, b) {
            return a._dateStart - b._dateStart;
          });

        updateShowCount(rawShows.length);
        applyFilters();
      })
      .catch(function(err) {
        console.error('Failed to load calendar.json:', err);
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        emptyState.querySelector('.empty-state-text').textContent = 'Unable to load shows. Please try again later.';
      });
  }

  /* ── Initial load ─────────────────────────────────────── */
  loadShows();

})();
</script>

<script src="/js/main.js"></script>
</body>
</html>
