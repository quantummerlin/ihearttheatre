<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>What's On — iHeartTheatre</title>
  <meta name="description" content="The complete community theatre calendar — shows happening now, opening soon and coming up near you.">
  <meta property="og:title" content="What's On — iHeartTheatre">
  <meta property="og:description" content="Community theatre shows, dates, venues and booking info.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#8B0000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/icons/iht-icon.svg">
  <link rel="manifest" href="/manifest.json">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RS9LV72HK8"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RS9LV72HK8');</script>
</head>
<body>
<main>

  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="page-hero-eyebrow">🎭 Theatre Calendar</div>
    <h1 class="page-hero-title">What's <em>On</em></h1>
    <p class="page-hero-sub">Community theatre shows across the UK — now showing, opening soon and coming up. Updated weekly.</p>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar" role="toolbar" aria-label="Filter shows">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="now">Now Showing</button>
    <button class="filter-btn" data-filter="soon">Opening Soon</button>
    <button class="filter-btn" data-filter="musical">Musical</button>
    <button class="filter-btn" data-filter="drama">Drama</button>
    <button class="filter-btn" data-filter="comedy">Comedy</button>
    <button class="filter-btn" data-filter="kids">Kids</button>
    <div style="margin-left:auto;flex-shrink:0">
      <div class="search-bar">
        <span class="search-bar-icon">🔍</span>
        <input type="text" id="showSearch" placeholder="Search shows…" aria-label="Search shows">
      </div>
    </div>
  </div>

  <!-- SHOWS GRID — populated from data inline + JS filter -->
  <section class="hub-section reveal-section" aria-label="Shows listing" style="padding-bottom:40px">
    <div class="show-card-grid reveal-stagger" id="showsGrid">
      <!-- Populated by inline data + optional calendar.json fetch below -->
    </div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-state-icon">🎭</div>
      <div class="empty-state-text">No shows match your filter. Try another category.</div>
    </div>
  </section>

</main>

<script>
/* ── What's On — show data + filter logic ────────────────── */
(function() {

  var SHOWS = [
    /* NOW SHOWING */
    { id:'s01', title:'Mamma Mia!',       genre:'musical', status:'now',  company:'Cheltenham Operatic Society', venue:'Everyman Theatre, Cheltenham', dates:'Through 25 May 2025', emoji:'🎭', href:'/shows/mamma-mia-cheltenham-2025.html' },
    { id:'s02', title:'Annie',            genre:'musical', status:'now',  company:'West Swindon Singers',        venue:'Wyvern Theatre, Swindon',      dates:'Through 22 May 2025', emoji:'🌟', href:'/shows/annie-west-swindon-2025.html' },
    { id:'s03', title:'Into the Woods',   genre:'musical', status:'now',  company:'Forest Youth Theatre',        venue:'Minack Theatre, Cornwall',     dates:'15–29 May 2025',      emoji:'🌳', href:'/shows/into-the-woods-forest-2025.html' },
    { id:'s04', title:'Chicago',          genre:'drama',   status:'now',  company:'Swindon Operatic Society',    venue:'Wyvern Theatre, Swindon',      dates:'CLOSING 21 May!',     emoji:'🎩', href:'/shows/chicago-swindon-2025.html' },
    { id:'s05', title:'Grease',           genre:'musical', status:'now',  company:'Bournemouth Musical Theatre', venue:'Lighthouse, Poole',            dates:'18–24 May 2025',      emoji:'⚡', href:'/shows/grease-bournemouth-2025.html' },
    { id:'s06', title:'Oliver!',          genre:'musical', status:'now',  company:'Swindon Musical Theatre',     venue:'Arts Centre, Swindon',         dates:'14–24 May 2025',      emoji:'🏚️', href:'/shows/oliver-swindon-2025.html' },

    /* OPENING SOON */
    { id:'s07', title:'Les Misérables',   genre:'musical', status:'soon', company:'Bournemouth G&S Society',    venue:'Pavilion, Bournemouth',        dates:'Opens 31 May 2025',   emoji:'🕯️', href:'/shows/les-mis-bournemouth-2025.html' },
    { id:'s08', title:'Guys and Dolls',   genre:'musical', status:'soon', company:'Dorset Operatic Society',    venue:'Lighthouse, Poole',            dates:'Opens 14 June 2025',  emoji:'🎲', href:'/shows/guys-dolls-dorset-2025.html' },
    { id:'s09', title:'Legally Blonde',   genre:'musical', status:'soon', company:'Swindon Operatic Society',   venue:'Wyvern Theatre, Swindon',      dates:'Opens 2 July 2025',   emoji:'💗', href:'/shows/legally-blonde-swindon-2025.html' },
    { id:'s10', title:'The Sound of Music', genre:'musical', status:'soon', company:'Cheltenham Operatic',      venue:'Everyman Theatre, Cheltenham', dates:'Opens 18 Sep 2025',   emoji:'🏔️', href:'/shows/sound-of-music-cheltenham-2025.html' },
    { id:'s11', title:'Sweeney Todd',     genre:'drama',   status:'soon', company:'Oxford Stage Company',       venue:'New Theatre, Oxford',          dates:'Opens 5 June 2025',   emoji:'🪒', href:'/shows/sweeney-todd-oxford-2025.html' },
    { id:'s12', title:'Bugsy Malone',     genre:'comedy',  status:'soon', company:'Footlights Youth Theatre',   venue:'Arts Centre, Swindon',         dates:'Opens 12 July 2025',  emoji:'🔫', href:'/shows/bugsy-malone-footlights-2025.html' },

    /* KIDS */
    { id:'s13', title:'Matilda Jr.',      genre:'kids',    status:'soon', company:'Junior Theatre Workshop',    venue:'Arts Centre, Swindon',         dates:'Opens 19 July 2025',  emoji:'📚', href:'/shows/matilda-jr-2025.html' },
    { id:'s14', title:'The Jungle Book',  genre:'kids',    status:'soon', company:'Kidstage Productions',       venue:'Minack Theatre, Cornwall',     dates:'Opens 26 July 2025',  emoji:'🐆', href:'/shows/jungle-book-kidstage-2025.html' },

    /* COMING UP */
    { id:'s15', title:'Cabaret',          genre:'drama',   status:'soon', company:'Swindon Musical Theatre',    venue:'Wyvern Theatre, Swindon',      dates:'Opens Oct 2025',      emoji:'🎪', href:'/shows/cabaret-swindon-2025.html' },
    { id:'s16', title:'Mary Poppins',     genre:'musical', status:'soon', company:'West Swindon Singers',       venue:'Wyvern Theatre, Swindon',      dates:'Opens Nov 2025',      emoji:'☂️', href:'/shows/mary-poppins-2025.html' }
  ];

  var grid = document.getElementById('showsGrid');
  var emptyState = document.getElementById('emptyState');
  var currentFilter = 'all';
  var currentSearch = '';

  function buildStatusBadge(status) {
    if (status === 'now') return '<span class="badge badge-musical">Now Showing</span>';
    if (status === 'soon') return '<span class="badge badge-audition">Opening Soon</span>';
    return '<span class="badge badge-company">Upcoming</span>';
  }

  function buildGenreBadge(genre) {
    var map = { musical:'badge-musical', drama:'badge-drama', comedy:'badge-comedy', kids:'badge-kids' };
    var cls = map[genre] || 'badge-company';
    var label = genre.charAt(0).toUpperCase() + genre.slice(1);
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }

  function renderShows(shows) {
    if (!shows.length) {
      grid.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';
    grid.innerHTML = shows.map(function(s) {
      return (
        '<a href="' + s.href + '" class="show-card">' +
          '<div class="show-card-poster">' +
            '<div class="show-card-poster-placeholder">' + s.emoji + '</div>' +
          '</div>' +
          '<div class="show-card-body">' +
            '<div class="article-card-meta" style="margin-bottom:4px">' +
              buildStatusBadge(s.status) +
            '</div>' +
            '<h3 class="show-card-title">' + s.title + '</h3>' +
            '<div class="show-card-venue">' + s.venue + '</div>' +
            '<div class="show-card-dates">' + s.dates + '</div>' +
            '<div class="show-card-company">' +
              buildGenreBadge(s.genre) +
              '<span class="badge badge-company" style="margin-left:4px">' + s.company + '</span>' +
            '</div>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  }

  function applyFilters() {
    var filtered = SHOWS.filter(function(s) {
      var matchFilter = currentFilter === 'all'
        || currentFilter === s.genre
        || (currentFilter === 'now' && s.status === 'now')
        || (currentFilter === 'soon' && s.status === 'soon');
      var q = currentSearch.toLowerCase();
      var matchSearch = !q || s.title.toLowerCase().indexOf(q) !== -1
        || s.company.toLowerCase().indexOf(q) !== -1
        || s.venue.toLowerCase().indexOf(q) !== -1;
      return matchFilter && matchSearch;
    });
    renderShows(filtered);
  }

  /* Filter buttons */
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  /* Search */
  var searchInput = document.getElementById('showSearch');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      currentSearch = this.value;
      applyFilters();
    });
  }

  /* Try to load from calendar.json (future integration) */
  fetch('/data/calendar.json')
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) {
      if (data && data.shows && data.shows.length) {
        data.shows.forEach(function(s) {
          if (!SHOWS.find(function(x) { return x.id === s.id; })) {
            SHOWS.unshift(s);
          }
        });
        applyFilters();
      }
    })
    .catch(function() {});

  /* Initial render */
  applyFilters();

})();
</script>

<script src="/js/main.js"></script>
</body>
</html>
